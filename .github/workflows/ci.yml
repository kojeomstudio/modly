name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch on new pushes — saves runner
# minutes when commits land in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Static checks — fast, run before the heavier OS-specific builds.
  # Note: `npm run lint` is intentionally skipped — the repo has no eslint
  # config and eslint 9 requires one. Re-enable once a config is added.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type-check (Electron main + preload)
        run: npx tsc --noEmit -p tsconfig.node.json

  # Python smoke tests — light, no torch. Catches manifest schema drift,
  # cross-platform import regressions, and the platform-filter helper.
  api-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run smoke tests
        run: python -m pytest api/tests -v

  build-windows:
    needs: typecheck
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download Python embed
        run: node scripts/download-python-embed.js
      - name: Build & Package (Windows)
        run: npx electron-vite build && npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

  build-linux:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Linux build dependencies
        run: sudo apt-get install -y rpm
      - name: Build & Package (Linux)
        run: npx electron-vite build && npx electron-builder --linux --publish never

  build-macos:
    needs: typecheck
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download Python embed (arm64)
        run: node scripts/download-python-embed.js
      # CI builds are unsigned — release.yml handles notarized builds when
      # APPLE_* secrets are present. CSC_IDENTITY_AUTO_DISCOVERY=false stops
      # electron-builder from picking a stray identity in the runner keychain.
      - name: Build & Package (macOS arm64)
        run: npx electron-vite build && npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
